<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Video Task Bot</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#0d111b;--panel:#171e2c;--muted:#9aa8bd;--blue:#4d9cff;--line:#293449}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f6fc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:22px 18px 16px;background:linear-gradient(135deg,#172b4c,#121827)}h1{font-size:22px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:13px}.wrap{padding:14px;max-width:720px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.title{font-size:17px;font-weight:700}.meta{color:var(--muted);font-size:12px;margin-top:6px}.tasks{display:grid;gap:8px;margin-top:12px}.task{border:1px solid #2c3a51;background:#111826;border-radius:12px;padding:11px}.taskrow{display:flex;gap:10px;align-items:center}.taskname{flex:1;font-size:14px}.btn{border:0;background:var(--blue);color:#071323;font-weight:700;border-radius:10px;padding:10px 13px;font-size:13px}.btn:disabled{opacity:.45}.done{color:#65dba0;font-size:12px}.empty{text-align:center;padding:32px 12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#080b12f5;z-index:5;display:none;overflow:auto;padding:18px}.modal.open{display:block}.adbox{max-width:520px;margin:8vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.progress{height:7px;background:#2a3447;border-radius:9px;overflow:hidden;margin:16px 0}.bar{height:100%;width:0;background:#4d9cff;transition:width .2s}.big{font-size:32px;font-weight:800;text-align:center;margin:16px}.adlink{display:block;padding:14px;background:#202c40;border-radius:12px;text-align:center;color:#9ecbff;text-decoration:none;font-weight:700;margin:10px 0}.small{font-size:12px;color:var(--muted);line-height:1.5}.full{width:100%;margin-top:10px}
</style></head><body><header><h1>🎬 Video Task</h1><p>সব Task শেষ করো, ভিডিও Bot থেকে পেয়ে যাও</p></header><main class="wrap" id="app"><div class="empty">লোড হচ্ছে…</div></main><section class="modal" id="modal"><div class="adbox"><div class="title" id="adtitle">Advertisement</div><p id="adsub">১০ সেকেন্ড অপেক্ষা করো</p><div class="progress"><div class="bar" id="bar"></div></div><div class="big" id="timer">10s</div><a class="adlink" id="visit" target="_blank" rel="noopener">বিজ্ঞাপন খুলুন ↗</a><p class="small" id="adnote">প্রতিটি বিজ্ঞাপনের জন্য ১০ সেকেন্ড। তিনটি ধাপ শেষ হলে Task Complete হবে।</p><button class="btn full" id="next" disabled>পরের বিজ্ঞাপন</button><button class="btn full" id="verify" style="display:none">Channel Subscribe যাচাই করো</button><button class="btn full" id="cancel" style="background:#2a3447;color:#fff">বন্ধ করো</button></div></section>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand(); const initData=tg?.initData||''; const app=document.getElementById('app'); let current=null, timer=null;
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'content-type':'application/json','x-telegram-init-data':initData},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{if(!initData)throw new Error('এই পেজটি Telegram Bot-এর বাটন থেকে খুলতে হবে।');const d=await api('/api/catalog');if(!d.videos.length){app.innerHTML='<div class="empty">এখনও কোনো ভিডিও যোগ করা হয়নি। পরে আবার দেখো।</div>';return}app.innerHTML=d.videos.map(v=>`<article class="card"><div class="title">🎞️ ${esc(v.title)}</div><div class="meta">${v.tasks.filter(t=>t.done).length}/${v.tasks.length} Task Complete</div><div class="tasks">${v.tasks.map(t=>`<div class="task"><div class="taskrow"><div class="taskname">${t.kind==='channel'?'📢':'📺'} ${esc(t.title)}</div>${t.done?'<span class="done">✓ Done</span>':`<button class="btn" onclick="startTask(${v.id},${t.id},'${esc(t.kind)}')">${t.kind==='channel'?'Subscribe':'Task Now'}</button>`}</div></div>`).join('')||'<p>এই ভিডিওতে Task সেট করা হয়নি।</p>'}</div></article>`).join('')}catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
window.startTask=async(video_id,task_id,kind)=>{try{const d=await api('/api/start-task',{video_id,task_id});if(d.channel_verified){tg?.showAlert('Channel Subscribe verified!');return load()}current={...d,video_id,task_id};document.getElementById('modal').classList.add('open');document.getElementById('cancel').style.display='block';if(kind==='channel'){document.getElementById('adtitle').textContent=d.title;document.getElementById('adsub').textContent='Channel-এ যোগ দিয়ে ফিরে এসে যাচাই করো';document.getElementById('visit').href=d.url;document.getElementById('visit').textContent='Telegram Channel খুলুন ↗';document.getElementById('bar').style.width='100%';document.getElementById('timer').textContent='✓';document.getElementById('next').style.display='none';document.getElementById('verify').style.display='block';}else{document.getElementById('next').style.display='block';document.getElementById('verify').style.display='none';runAds(d.url.split(','));}}catch(e){tg?.showAlert(e.message)}};
function runAds(urls){let index=0;const next=document.getElementById('next');const visit=document.getElementById('visit');const bar=document.getElementById('bar');const timerEl=document.getElementById('timer');const title=document.getElementById('adtitle');const sub=document.getElementById('adsub');function step(){if(index>=3){clearInterval(timer);finish();return}let remaining=10;visit.href=urls[index];visit.textContent=`বিজ্ঞাপন ${index+1} খুলুন ↗`;title.textContent=`Advertisement ${index+1} of 3`;sub.textContent=`বিজ্ঞাপন ${index+1}: ১০ সেকেন্ড`;timerEl.textContent='10s';bar.style.width='0%';next.disabled=true;next.textContent=index===2?'Task Complete হচ্ছে…':'পরের বিজ্ঞাপন';clearInterval(timer);timer=setInterval(()=>{remaining--;timerEl.textContent=remaining+'s';bar.style.width=((10-remaining)/10*100)+'%';if(remaining<=0){clearInterval(timer);index++;if(index>=3){title.textContent='সব বিজ্ঞাপন শেষ';sub.textContent='Task স্বয়ংক্রিয়ভাবে Complete হচ্ছে…';visit.style.display='none';next.style.display='none';timerEl.textContent='✓';bar.style.width='100%';setTimeout(finish,500)}else{step();}}},1000)}next.onclick=()=>{if(!next.disabled)step()};step()}
async function finish(){clearInterval(timer);try{const d=await api('/api/complete-task',{token:current.token});document.getElementById('modal').classList.remove('open');tg?.showAlert(d.video_sent?'সব Task শেষ! ভিডিও Bot-এ পাঠানো হয়েছে।':`Task Complete! (${d.completed}/${d.total})`);current=null;load()}catch(e){tg?.showAlert(e.message)}}
document.getElementById('verify').onclick=async()=>{try{const d=await api('/api/complete-task',{token:current.token});document.getElementById('modal').classList.remove('open');tg?.showAlert(d.video_sent?'ভিডিও পাঠানো হয়েছে!':`Task Complete (${d.completed}/${d.total})`);current=null;load()}catch(e){tg?.showAlert(e.message)}};document.getElementById('cancel').onclick=()=>{clearInterval(timer);document.getElementById('modal').classList.remove('open');current=null;load()};load();
</script></body></html>
